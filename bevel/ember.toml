[package]
name = "alloy/bevel"
version = "0.1.0"
description = "Components, services, and injectors for Alloy, after Angular, on Vide"
authors = ["savruun"]
license = "MIT"

[target]
environment = "roblox"
language = "alloy"
main = "build/index.luau"
includes = ["src", "build", ".config.aly", "README.md", "LICENSE"]

[dependencies]
vide = { name = "centau/vide", version = "^0.4.1", index = "wally" }

[indices]
wally = "https://github.com/UpliftGames/wally-index"
